<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Victor Mendoza, Luisa Triana">
<meta name="contributor" content="Luisa Triana - https://luisatriana.dev/ - https://github.com/lutriana">
<link rel="author" href="https://luisatriana.dev/">
<link rel="me" href="https://github.com/lutriana">
<title>Ahorro para el viaje</title>
<meta name="description" content="Seguimiento de ahorros compartidos para un viaje.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">

</head>
<body>
<main class="wrap">

  <div class="hero">
    <div class="hero-top">
      <div class="hero-content">
        <p class="eyebrow"><span class="status-dot" id="statusDot"></span><span id="statusText">Conectando…</span></p>
        <label for="goalName" class="visually-hidden">Nombre de la meta</label>
        <input id="goalName" type="text" value="VIAJE PARA DECAMERON" maxlength="60">
        <div class="goal-amount-row">
          <label for="goalAmount">Meta: $</label>
          <input id="goalAmount" type="number" min="0" step="1000" value="5000000">
          <span>COP</span>
        </div>
      </div>
      <button class="reset-btn" id="resetBtn">↺ Reiniciar conteo</button>
    </div>

    <div class="jar-row">
      <div class="jar"><div class="jar-water" id="jarWater"></div></div>
      <div class="progress-info">
        <div class="pct"><span id="pctNum">0</span><span>%</span></div>
        <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
        <div class="stats-row">
          <div class="stat ahorrado">
            <small>Ahorrado</small>
            <strong id="totalAhorrado">$0</strong>
          </div>
          <div class="stat falta">
            <small>Falta</small>
            <strong id="totalFalta">$0</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="section-title">
    Aportes por persona
    <button class="add-person-btn" id="addPersonBtn" type="button">+ Añadir persona</button>
  </div>

  <div class="people-grid" id="peopleGrid"></div>

  <div class="history" id="historyWrap">
    <div class="section-title history-title">Metas anteriores</div>
    <div id="historyList"></div>
  </div>

  <footer id="footerNote">Sincronizando en tiempo real con Firebase.</footer>
</main>

<template id="personCardTpl">
  <div class="person-card">
    <div class="person-head">
      <input class="person-name" type="text" maxlength="30" aria-label="Nombre de la persona">
      <button class="remove-person" title="Eliminar persona" type="button">✕</button>
    </div>
    <div class="denom-group-label">Monedas</div>
    <div class="coins-wrap"></div>
    <div class="denom-group-label">Billetes</div>
    <div class="bills-wrap"></div>
    <div class="person-total">
      <span>Subtotal</span>
      <strong class="subtotal-value">$0</strong>
    </div>
  </div>
</template>

<!-- Firebase SDK -->
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script defer src="assets/js/app.js"></script>
</body>
</html>
